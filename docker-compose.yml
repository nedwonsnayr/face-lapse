services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # No published ports: only cloudflared (same network) can reach it.
    # For a local smoke test: docker compose run --rm -p 127.0.0.1:8000:8000 app

  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
