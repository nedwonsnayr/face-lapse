<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Lapse</title>
    <!-- The Face Lapse mark: tab icon (SVG, with a PNG fallback) and the icon for installed / Dock web apps. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- use-credentials: the app sits behind Cloudflare Access, which would bounce an anonymous manifest fetch. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#f6f3ee" />
    <script>
      // Apply the saved theme before first paint so dark mode never flashes
      // white. Kept in step with applyTheme() in src/settings.tsx.
      (function () {
        var theme = "system";
        try {
          var saved = JSON.parse(localStorage.getItem("face-lapse:settings") || "{}").theme;
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.querySelector('meta[name="theme-color"]').content = "#161411";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
